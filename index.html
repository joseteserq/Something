<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something</title>
    <style>
      :root {
        --bg: #f7f2ff;
        --panel: #ffffff;
        --primary: #6d4aff;
        --primary-dark: #4a2cc4;
        --text: #1d1b2b;
        --muted: #655f7a;
        --glow: rgba(109, 74, 255, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #fff 0%, var(--bg) 35%, #efe8ff 100%);
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--text);
      }

      .card {
        width: min(92vw, 640px);
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(109, 74, 255, 0.14);
        border-radius: 24px;
        box-shadow: 0 28px 60px var(--glow);
        padding: 2rem;
      }

      .eyebrow {
        display: inline-block;
        background: rgba(109, 74, 255, 0.1);
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 0.4rem 0.8rem;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 1rem 0 0.5rem;
        font-size: clamp(2.2rem, 4vw, 3.7rem);
        line-height: 1.05;
      }

      .subtitle {
        margin: 0 0 1.4rem;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .idea-box {
        background: linear-gradient(135deg, #f5f0ff, #eef4ff);
        border: 1px solid rgba(109, 74, 255, 0.15);
        border-radius: 18px;
        padding: 1.4rem 1.2rem;
        margin: 1rem 0 1.2rem;
      }

      .idea-label {
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        display: block;
        margin-bottom: 0.7rem;
      }

      .idea-text {
        font-size: clamp(1.3rem, 2vw, 2rem);
        font-weight: 800;
        line-height: 1.3;
      }

      .actions {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.2rem;
        background: var(--primary);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        box-shadow: 0 12px 24px rgba(109, 74, 255, 0.28);
      }

      button:hover {
        transform: translateY(-1px);
        background: var(--primary-dark);
      }

      button.secondary {
        background: rgba(109, 74, 255, 0.1);
        color: var(--primary-dark);
        box-shadow: none;
      }

      button.secondary:hover {
        background: rgba(109, 74, 255, 0.16);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">Something</span>
      <h1>Make something cool.</h1>
      <p class="subtitle">A tiny spark of inspiration for your next project.</p>

      <div class="idea-box" aria-live="polite">
        <span class="idea-label">Idea</span>
        <div id="idea" class="idea-text">Build a tiny weather diary for your neighborhood.</div>
      </div>

      <div class="actions">
        <button id="newIdeaBtn" type="button">Generate idea</button>
        <button id="shuffleBtn" class="secondary" type="button">Shuffle vibes</button>
      </div>
    </main>

    <script>
      const ideas = [
        "Build a tiny weather diary for your neighborhood.",
        "Create a digital postcard generator for your favorite places.",
        "Design a habit tracker that rewards tiny wins.",
        "Make a local map of hidden cafes, parks, and sunsets.",
        "Turn a family recipe into a playful storybook app.",
        "Build a tiny app that helps you remember good ideas.",
        "Make a visual journal for everyday small joys.",
        "Create a tiny music playlist generator from the weather.",
        "Design a to-do list that celebrates progress instead of guilt.",
        "Build a "something" generator for people who need inspiration."
      ];

      const ideaEl = document.getElementById("idea");
      const newIdeaBtn = document.getElementById("newIdeaBtn");
      const shuffleBtn = document.getElementById("shuffleBtn");

      function randomIdea() {
        const next = ideas[Math.floor(Math.random() * ideas.length)];
        ideaEl.textContent = next;
      }

      newIdeaBtn.addEventListener("click", randomIdea);
      shuffleBtn.addEventListener("click", () => {
        const current = ideaEl.textContent;
        let next = current;
        while (next === current) {
          next = ideas[Math.floor(Math.random() * ideas.length)];
        }
        ideaEl.textContent = next;
      });
    </script>
  </body>
</html>
